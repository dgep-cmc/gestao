<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://challenges.cloudflare.com; frame-src 'self' https://*.firebaseapp.com https://*.googleapis.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://lh3.googleusercontent.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://gestao-pessoas.onrender.com wss://*.googleapis.com https://challenges.cloudflare.com;" />
    <title>Portal de Gerenciamento de Frequências e Contratações</title>
    <script type="module" crossorigin src="./assets/index-tiwSozaZ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BZtvCoDX.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="global-error" style="display:none; padding: 20px; font-family: sans-serif; color: #721c24; background: #f8d7da; min-height: 100vh; z-index: 99999; position: absolute; top: 0; left: 0; right: 0;">
      <h2>Erro Crítico de Carregamento</h2>
      <p>Detalhes do erro:</p>
      <pre id="global-error-details" style="background: rgba(0,0,0,0.1); padding: 10px; border-radius: 4px; white-space: pre-wrap; word-break: break-word;"></pre>
    </div>
    <script>
      window.addEventListener('error', function(event) {
        // Ignorar erros que não sejam de script (ex: iframes, event.target pode ser script)
        var msg = event.message || '';
        if (!msg && event.target && event.target.tagName === 'SCRIPT') {
          msg = 'Falha ao carregar script: ' + event.target.src;
        }
        document.getElementById('root').style.display = 'none';
        document.getElementById('global-error').style.display = 'block';
        
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isLocal) {
          document.getElementById('global-error-details').innerText = 'Mensagem: ' + msg + '\n' + (event.error && event.error.stack ? event.error.stack : '');
        } else {
          document.getElementById('global-error-details').innerText = 'Mensagem: Ocorreu um erro crítico ao inicializar a aplicação. Se o problema persistir, por favor contate a DGEP.';
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('root').style.display = 'none';
        document.getElementById('global-error').style.display = 'block';
        
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isLocal) {
          document.getElementById('global-error-details').innerText = 'Uncaught Promise Rejection: ' + (event.reason ? (event.reason.stack || event.reason) : 'Unknown reason');
        } else {
          document.getElementById('global-error-details').innerText = 'Mensagem: Ocorreu um erro crítico inesperado. Se o problema persistir, por favor contate a DGEP.';
        }
      });
    </script>
  </body>
</html>
